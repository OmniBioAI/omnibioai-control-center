name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install -e .
          pip install ruff pytest

      # Scoped to the Admin Console milestone's own files (PR A1-E),
      # not `ruff check .` repo-wide -- the wider backend/ tree carries
      # ~341 pre-existing ruff violations unrelated to this milestone
      # (confirmed by isolating this diff's own changed lines before
      # scoping), predating CI's own re-enablement here. Fixing that
      # repo-wide debt is real, separate, unrelated work, out of scope
      # for "no code modification during release preparation" -- this
      # scoped check gates what this milestone actually owns instead of
      # gating on debt it didn't create. main.py and routes_dashboard.py
      # are touched by this milestone (CORS config, business widget)
      # but deliberately excluded here too: both are large pre-existing
      # files whose *other*, untouched regions (an embedded HTML/JS
      # block in main.py, older Optional[]-style hints and import order
      # in routes_dashboard.py) still carry violations that predate and
      # are unrelated to this milestone's own additions to those files.
      - name: Lint with ruff (Admin Console milestone files)
        working-directory: backend
        run: |
          ruff check \
            src/control_center/api/routes_billing_proxy.py \
            src/control_center/api/routes_model_registry_proxy.py \
            src/control_center/api/routes_platform_config_proxy.py \
            src/control_center/api/routes_rag_proxy.py \
            src/control_center/api/routes_tes_proxy.py \
            src/control_center/api/routes_workflow_bundles_proxy.py \
            tests/test_routes_billing_proxy.py \
            tests/test_routes_model_registry_proxy.py \
            tests/test_routes_platform_config_proxy.py \
            tests/test_routes_rag_proxy.py \
            tests/test_routes_tes_proxy.py \
            tests/test_routes_workflow_bundles_proxy.py

      - name: Run tests
        working-directory: backend
        run: |
          if [ -d tests ]; then
            pytest --tb=short -q
          else
            echo "No tests directory found, skipping pytest"
          fi

  # Resolves and validates (once, for every downstream job) the exact
  # release version and the exact source commit SHA being published.
  # Fails closed if the tag isn't vX.Y.Z or if GITHUB_SHA is ever
  # anything other than a genuine 40-character hex SHA -- no short SHA,
  # no branch name, no tag text is ever accepted as OCI revision.
  resolve-version:
    name: Resolve release version and source SHA
    runs-on: ubuntu-24.04
    needs: lint-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
      repo: ${{ steps.resolve.outputs.repo }}
    permissions:
      contents: read
    steps:
      - name: Resolve and validate
        id: resolve
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag '$TAG' is not a valid vX.Y.Z semver tag" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          SHA="${GITHUB_SHA}"
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GITHUB_SHA '$SHA' is not an exact 40-character hex SHA" >&2
            exit 1
          fi
          # Single authoritative lowercasing point: GHCR/OCI repository names
          # must be all-lowercase, but github.repository preserves the GitHub
          # org's actual configured case (OmniBioAI/...). Every downstream
          # job consumes this output instead of touching github.repository
          # directly, so there is exactly one place this normalization can
          # ever drift.
          REPO_LOWER="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "version=${VERSION}"
            echo "sha=${SHA}"
            echo "repo=${REPO_LOWER}"
          } >> "$GITHUB_OUTPUT"

  # ── Native per-architecture builds ──────────────────────────────────
  # Each of these 4 jobs builds and pushes exactly ONE architecture of
  # ONE image to its own collision-safe staging tag (never a mutable
  # version/latest tag -- see build-native-arch-image/action.yml). They
  # are intentionally 4 explicit jobs, not one matrix: a matrix job's
  # per-cell `outputs` are not reliably addressable downstream (the last
  # matrix cell to finish silently wins), which is exactly the kind of
  # architecture-write collision this design has to avoid.
  #
  # Runs on native GitHub-hosted arm64/amd64 runners. No QEMU, no
  # `platform:` emulation override anywhere in this file.
  build-backend-amd64:
    name: Build backend (linux/amd64)
    runs-on: ubuntu-24.04
    needs: resolve-version
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: build
        uses: ./.github/actions/build-native-arch-image
        with:
          target: backend
          image: ghcr.io/${{ needs.resolve-version.outputs.repo }}
          arch: amd64
          expect-uname: x86_64
          version: ${{ needs.resolve-version.outputs.version }}
          source-sha: ${{ needs.resolve-version.outputs.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  build-backend-arm64:
    name: Build backend (linux/arm64)
    runs-on: ubuntu-24.04-arm
    needs: resolve-version
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: build
        uses: ./.github/actions/build-native-arch-image
        with:
          target: backend
          image: ghcr.io/${{ needs.resolve-version.outputs.repo }}
          arch: arm64
          expect-uname: aarch64
          version: ${{ needs.resolve-version.outputs.version }}
          source-sha: ${{ needs.resolve-version.outputs.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  build-frontend-amd64:
    name: Build frontend (linux/amd64)
    runs-on: ubuntu-24.04
    needs: resolve-version
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: build
        uses: ./.github/actions/build-native-arch-image
        with:
          target: frontend
          image: ghcr.io/${{ needs.resolve-version.outputs.repo }}-web
          arch: amd64
          expect-uname: x86_64
          version: ${{ needs.resolve-version.outputs.version }}
          source-sha: ${{ needs.resolve-version.outputs.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  build-frontend-arm64:
    name: Build frontend (linux/arm64)
    runs-on: ubuntu-24.04-arm
    needs: resolve-version
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: build
        uses: ./.github/actions/build-native-arch-image
        with:
          target: frontend
          image: ghcr.io/${{ needs.resolve-version.outputs.repo }}-web
          arch: arm64
          expect-uname: aarch64
          version: ${{ needs.resolve-version.outputs.version }}
          source-sha: ${{ needs.resolve-version.outputs.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ── Deterministic OCI index assembly ────────────────────────────────
  # Only after BOTH architecture builds for an image have succeeded:
  # assemble a STAGING index directly from the two immutable
  # per-architecture digests (never from a mutable tag). This is
  # deliberately NOT the public :X.Y.Z tag yet -- it is itself a
  # collision-safe, per-commit staging ref, so that neither :X.Y.Z nor
  # :latest is ever written until verification AND every native runtime
  # smoke for that image has passed (see publish-version-* / promote-
  # latest-* below). This closes the gap a simpler "assemble straight to
  # :X.Y.Z" design would leave: a public version tag existing before it
  # has been proven to satisfy the release contract.
  assemble-backend:
    name: Assemble backend staging index
    runs-on: ubuntu-24.04
    needs: [resolve-version, build-backend-amd64, build-backend-arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble staging index from immutable per-arch digests
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ needs.resolve-version.outputs.repo }}"
          SHA="${{ needs.resolve-version.outputs.sha }}"
          docker buildx imagetools create \
            --tag "${IMAGE}:staging-index-${SHA}" \
            "${IMAGE}@${{ needs.build-backend-amd64.outputs.digest }}" \
            "${IMAGE}@${{ needs.build-backend-arm64.outputs.digest }}"
          docker buildx imagetools inspect "${IMAGE}:staging-index-${SHA}"

  assemble-frontend:
    name: Assemble frontend staging index
    runs-on: ubuntu-24.04
    needs: [resolve-version, build-frontend-amd64, build-frontend-arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble staging index from immutable per-arch digests
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ needs.resolve-version.outputs.repo }}-web"
          SHA="${{ needs.resolve-version.outputs.sha }}"
          docker buildx imagetools create \
            --tag "${IMAGE}:staging-index-${SHA}" \
            "${IMAGE}@${{ needs.build-frontend-amd64.outputs.digest }}" \
            "${IMAGE}@${{ needs.build-frontend-arm64.outputs.digest }}"
          docker buildx imagetools inspect "${IMAGE}:staging-index-${SHA}"

  # ── Structured remote verification (fails closed) ───────────────────
  # Re-derives every release-contract fact from the REAL staging index
  # -- runtime-manifest count/arch, OCI source/revision/version, SBOM and
  # provenance subject-binding -- never from what the build jobs merely
  # claim to have pushed. Nothing public (:X.Y.Z or :latest) can be
  # written unless this passes.
  verify-backend:
    name: Verify staged backend release contract
    runs-on: ubuntu-24.04
    needs: [resolve-version, assemble-backend]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - run: |
          scripts/ci/verify_release_image.sh \
            "ghcr.io/${{ needs.resolve-version.outputs.repo }}" \
            "staging-index-${{ needs.resolve-version.outputs.sha }}" \
            "https://github.com/${{ github.repository }}" \
            "${{ needs.resolve-version.outputs.sha }}" \
            "${{ needs.resolve-version.outputs.version }}"

  verify-frontend:
    name: Verify staged frontend release contract
    runs-on: ubuntu-24.04
    needs: [resolve-version, assemble-frontend]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - run: |
          scripts/ci/verify_release_image.sh \
            "ghcr.io/${{ needs.resolve-version.outputs.repo }}-web" \
            "staging-index-${{ needs.resolve-version.outputs.sha }}" \
            "https://github.com/${{ github.repository }}" \
            "${{ needs.resolve-version.outputs.sha }}" \
            "${{ needs.resolve-version.outputs.version }}"

  # ── Native runtime smoke (per architecture, against the staging index) ──
  # Each job resolves its OWN architecture's exact digest fresh from the
  # just-verified staging index, pulls by that digest, and proves the
  # smallest meaningful safe contract for that image. Gated on verify-*
  # so a smoke job never runs against unverified metadata. Still never
  # touches :X.Y.Z or :latest.
  smoke-backend-amd64:
    name: Native runtime smoke - backend (linux/amd64)
    runs-on: ubuntu-24.04
    needs: [resolve-version, verify-backend]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - run: |
          scripts/ci/native_runtime_smoke.sh backend \
            "ghcr.io/${{ needs.resolve-version.outputs.repo }}" \
            "staging-index-${{ needs.resolve-version.outputs.sha }}" \
            x86_64

  smoke-backend-arm64:
    name: Native runtime smoke - backend (linux/arm64)
    runs-on: ubuntu-24.04-arm
    needs: [resolve-version, verify-backend]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - run: |
          scripts/ci/native_runtime_smoke.sh backend \
            "ghcr.io/${{ needs.resolve-version.outputs.repo }}" \
            "staging-index-${{ needs.resolve-version.outputs.sha }}" \
            aarch64

  smoke-frontend-amd64:
    name: Native runtime smoke - frontend (linux/amd64)
    runs-on: ubuntu-24.04
    needs: [resolve-version, verify-frontend]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - run: |
          scripts/ci/native_runtime_smoke.sh frontend \
            "ghcr.io/${{ needs.resolve-version.outputs.repo }}-web" \
            "staging-index-${{ needs.resolve-version.outputs.sha }}" \
            x86_64

  smoke-frontend-arm64:
    name: Native runtime smoke - frontend (linux/arm64)
    runs-on: ubuntu-24.04-arm
    needs: [resolve-version, verify-frontend]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - run: |
          scripts/ci/native_runtime_smoke.sh frontend \
            "ghcr.io/${{ needs.resolve-version.outputs.repo }}-web" \
            "staging-index-${{ needs.resolve-version.outputs.sha }}" \
            aarch64

  # ── Publish the public version tag (only after full verification + smoke) ──
  # This is the ONLY place that ever writes the public :X.Y.Z tag, and it
  # does so by retagging the already-assembled, already-verified,
  # already-smoke-tested staging index -- never by building or
  # assembling anything new. :X.Y.Z therefore can never be observably
  # single-architecture, unverified, or unsmoked at the moment it first
  # appears.
  publish-version-backend:
    name: Publish backend :X.Y.Z
    runs-on: ubuntu-24.04
    needs: [resolve-version, verify-backend, smoke-backend-amd64, smoke-backend-arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ needs.resolve-version.outputs.repo }}"
          SHA="${{ needs.resolve-version.outputs.sha }}"
          VERSION="${{ needs.resolve-version.outputs.version }}"
          docker buildx imagetools create --tag "${IMAGE}:${VERSION}" "${IMAGE}:staging-index-${SHA}"

  publish-version-frontend:
    name: Publish frontend :X.Y.Z
    runs-on: ubuntu-24.04
    needs: [resolve-version, verify-frontend, smoke-frontend-amd64, smoke-frontend-arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ needs.resolve-version.outputs.repo }}-web"
          SHA="${{ needs.resolve-version.outputs.sha }}"
          VERSION="${{ needs.resolve-version.outputs.version }}"
          docker buildx imagetools create --tag "${IMAGE}:${VERSION}" "${IMAGE}:staging-index-${SHA}"

  # ── latest promotion (gated last, atomic retag of the published version) ──
  # Never builds anything new: retags the just-published :X.Y.Z to
  # :latest, so :latest can never observably point at a partially
  # completed release either.
  promote-latest-backend:
    name: Promote backend :latest
    runs-on: ubuntu-24.04
    needs: [resolve-version, publish-version-backend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ needs.resolve-version.outputs.repo }}"
          VERSION="${{ needs.resolve-version.outputs.version }}"
          docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:${VERSION}"

  promote-latest-frontend:
    name: Promote frontend :latest
    runs-on: ubuntu-24.04
    needs: [resolve-version, publish-version-frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ needs.resolve-version.outputs.repo }}-web"
          VERSION="${{ needs.resolve-version.outputs.version }}"
          docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:${VERSION}"
