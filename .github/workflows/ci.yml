name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install -e .
          pip install ruff pytest

      # Scoped to the Admin Console milestone's own files (PR A1-E),
      # not `ruff check .` repo-wide -- the wider backend/ tree carries
      # ~341 pre-existing ruff violations unrelated to this milestone
      # (confirmed by isolating this diff's own changed lines before
      # scoping), predating CI's own re-enablement here. Fixing that
      # repo-wide debt is real, separate, unrelated work, out of scope
      # for "no code modification during release preparation" -- this
      # scoped check gates what this milestone actually owns instead of
      # gating on debt it didn't create. main.py and routes_dashboard.py
      # are touched by this milestone (CORS config, business widget)
      # but deliberately excluded here too: both are large pre-existing
      # files whose *other*, untouched regions (an embedded HTML/JS
      # block in main.py, older Optional[]-style hints and import order
      # in routes_dashboard.py) still carry violations that predate and
      # are unrelated to this milestone's own additions to those files.
      - name: Lint with ruff (Admin Console milestone files)
        working-directory: backend
        run: |
          ruff check \
            src/control_center/api/routes_billing_proxy.py \
            src/control_center/api/routes_model_registry_proxy.py \
            src/control_center/api/routes_platform_config_proxy.py \
            src/control_center/api/routes_rag_proxy.py \
            src/control_center/api/routes_tes_proxy.py \
            src/control_center/api/routes_workflow_bundles_proxy.py \
            tests/test_routes_billing_proxy.py \
            tests/test_routes_model_registry_proxy.py \
            tests/test_routes_platform_config_proxy.py \
            tests/test_routes_rag_proxy.py \
            tests/test_routes_tes_proxy.py \
            tests/test_routes_workflow_bundles_proxy.py

      - name: Run tests
        working-directory: backend
        run: |
          if [ -d tests ]; then
            pytest --tb=short -q
          else
            echo "No tests directory found, skipping pytest"
          fi

  # The Dockerfile has two deployable stages, and a build without a
  # `target` produces only the last one (the nginx frontend). Pushing that
  # as omnibioai-control-center:latest would replace the backend that
  # omnibioai-studio's release compose files run from that name, so each
  # stage is built explicitly and pushed under its own image name:
  #   backend  -> ghcr.io/omnibioai/omnibioai-control-center      (:7070)
  #   frontend -> ghcr.io/omnibioai/omnibioai-control-center-web  (:5174)
  #
  # Runs on an arm64 runner: omnibioai-base (the backend's FROM) is
  # published for arm64 only, matching the aarch64 deployment host, so on
  # the default amd64 runner the backend's first RUN fails with
  # "exec format error" and the frontend comes out amd64-only.
  docker:
    name: Build & Push Docker image (${{ matrix.target }})
    runs-on: ubuntu-24.04-arm
    needs: lint-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: backend
            image: ghcr.io/${{ github.repository }}
          - target: frontend
            image: ghcr.io/${{ github.repository }}-web

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The VITE_LIMS_SSO_* values are public OAuth client settings (the
      # same defaults omnibioai-studio/docker-compose.yml passes), not
      # secrets; the backend stage ignores them.
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_LIMS_SSO_CLIENT_ID=omnibioai-lims
            VITE_LIMS_SSO_REDIRECT_URI=https://lims.omnibioai.org/sso/callback
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
