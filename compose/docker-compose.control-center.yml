services:
  control-center:
    build:
      context: ./deploy/control-center
      dockerfile: docker/Dockerfile
    container_name: omnibioai-control-center
    environment:
      CONTROL_CENTER_CONFIG: /config/control_center.yaml
      WORKSPACE_ROOT: /workspace
    volumes:
      - ./:/workspace
      - ./deploy/control-center/config:/config:ro
    ports:
      - "${CONTROL_CENTER_PORT:-7070}:7070"
    restart: unless-stopped

  # Usage Analytics v1: the Redis Streams consumer draining
  # interactions:events/audit:events into the analytics aggregates (see
  # backend/src/control_center/analytics/consumer.py's own module
  # docstring for why this is a separate process/container from the API
  # service above, not a background task on it). Same image as
  # control-center -- no separate Dockerfile -- only the command differs,
  # same "reuse the existing image, override command" shape a worker
  # needs here without inventing new build infrastructure.
  control-center-analytics-worker:
    build:
      context: ./deploy/control-center
      dockerfile: docker/Dockerfile
    container_name: omnibioai-control-center-analytics-worker
    command: ["python", "-m", "control_center.analytics.consumer"]
    environment:
      WORKSPACE_ROOT: /workspace
      # HIPAA PR3d: this worker now verifies audit:events signatures
      # (checks.audit_trail.classify_event_integrity via
      # control_center.core.jwt_verify.JWT_SECRET). Previously unset here
      # entirely, which would silently fall back to jwt_verify.py's own
      # "change-me" default and misclassify every genuinely-valid signed
      # event as "invalid" -- same env var name/value every other
      # JWT_SECRET consumer on the platform already uses (see
      # omnibioai-studio/docker-compose.yml's ${AUTH_SECRET_KEY:-change-me}
      # pattern, applied identically here, not a new secret or fallback).
      JWT_SECRET: ${AUTH_SECRET_KEY:-change-me}
    volumes:
      - ./:/workspace
    restart: unless-stopped
