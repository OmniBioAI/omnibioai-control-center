# PR14.7B: shared backend API proxy locations, `include`d by every
# server block in control-center.conf (one copy, not duplicated per
# domain). control_center/main.py registers every route bare/unprefixed
# -- no router anywhere uses APIRouter(prefix=...) -- so each top-level
# path segment needs its own location here. This list was derived
# directly from every @router.*/@app.* decorator in
# backend/src/control_center/{main.py,api/*.py} (not guessed, not copied
# from the old Stage 3 config, which only covered 6 of these and had
# gone stale as later PRs added routers). A future PR adding a new
# top-level route needs a matching entry here, or it's unreachable
# through this nginx -- same class of drift the old Stage 3 config had
# already fallen into before this PR.
location /activity        { proxy_pass http://control-center:7070; proxy_set_header Host $host; }
location /audit-trail     { proxy_pass http://control-center:7070; proxy_set_header Host $host; }
location /auth            { proxy_pass http://control-center:7070; proxy_set_header Host $host; }
location /celery          { proxy_pass http://control-center:7070; proxy_set_header Host $host; }
location /cloud           { proxy_pass http://control-center:7070; proxy_set_header Host $host; }
location /config          { proxy_pass http://control-center:7070; proxy_set_header Host $host; }
location /coverage        { proxy_pass http://control-center:7070; proxy_set_header Host $host; }
location /cron            { proxy_pass http://control-center:7070; proxy_set_header Host $host; }
location /dashboard       { proxy_pass http://control-center:7070; proxy_set_header Host $host; }
location /database        { proxy_pass http://control-center:7070; proxy_set_header Host $host; }
location /docker          { proxy_pass http://control-center:7070; proxy_set_header Host $host; }
location /gateway-traffic { proxy_pass http://control-center:7070; proxy_set_header Host $host; }
location /gpu             { proxy_pass http://control-center:7070; proxy_set_header Host $host; }
location /health           { proxy_pass http://control-center:7070; proxy_set_header Host $host; }

location /image-freshness { proxy_pass http://control-center:7070; proxy_set_header Host $host; }
location /integrity       { proxy_pass http://control-center:7070; proxy_set_header Host $host; }
location /knowledge-base  { proxy_pass http://control-center:7070; proxy_set_header Host $host; }
location /known-issues    { proxy_pass http://control-center:7070; proxy_set_header Host $host; }
