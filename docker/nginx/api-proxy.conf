location /llms            { proxy_pass http://control-center:7070; proxy_set_header Host $host; }
location /orgs            { proxy_pass http://control-center:7070; proxy_set_header Host $host; }
location /platform        { proxy_pass http://control-center:7070; proxy_set_header Host $host; }
