# PR14.7B: shared backend API proxy locations, `include`d by every
# server block in control-center.conf (one copy, not duplicated per
# domain). control_center/main.py registers every route bare/unprefixed
# -- no router anywhere uses APIRouter(prefix=...) -- so each top-level
# path segment needs its own location here. This list was derived
# directly from every @router.*/@app.* decorator in
# backend/src/control_center/{main.py,api/*.py} (not guessed, not copied
# from the old Stage 3 config, which only covered 6 of these and had
# gone stale as later PRs added routers). A future PR adding a new
# top-level route needs a matching entry here, or it's unreachable
# through this nginx -- same class of drift the old Stage 3 config had
# already fallen into before this PR.
#
# Admin Console login fix: every location below proxies through
# $control_center_upstream (set in control-center.conf's server blocks,
# resolved at request time via the `resolver` directive there) instead
# of a bare `proxy_pass http://control-center:7070;`. A bare hostname in
# proxy_pass is resolved ONCE, by libc getaddrinfo, when this nginx's
# worker process starts -- not re-resolved on Docker's DNS TTL -- so any
# time the control-center container is recreated (redeploy, crash-loop
# restart, `docker compose up --force-recreate control-center`) *after*
# this nginx has already started, every location here keeps sending
# traffic to the control-center container's OLD IP forever, 502ing with
# "connect() failed (111: Connection refused)" until control-center-web
# itself is also restarted. That silently broke `/auth/login` (and every
# other route here) for real browser sessions -- confirmed live via this
# container's own access/error logs -- even though auth-service itself
# was healthy and reachable the whole time (nginx never got far enough to
# reach it). Same fix already used for billing-service in the OTHER
# nginx config (omnibioai-studio/docker/nginx-router.conf) for the exact
# same reason: a `resolver` + request-time variable defers the DNS
# lookup to request time via Docker's embedded resolver instead of
# caching it for the process lifetime.
location /activity        { proxy_pass http://$control_center_upstream; proxy_set_header Host $host; }
location /audit-trail     { proxy_pass http://$control_center_upstream; proxy_set_header Host $host; }
location /auth            { proxy_pass http://$control_center_upstream; proxy_set_header Host $host; }
location /celery          { proxy_pass http://$control_center_upstream; proxy_set_header Host $host; }
location /cloud           { proxy_pass http://$control_center_upstream; proxy_set_header Host $host; }
location /config          { proxy_pass http://$control_center_upstream; proxy_set_header Host $host; }
location /coverage        { proxy_pass http://$control_center_upstream; proxy_set_header Host $host; }
location /cron            { proxy_pass http://$control_center_upstream; proxy_set_header Host $host; }
location /dashboard       { proxy_pass http://$control_center_upstream; proxy_set_header Host $host; }
location /database        { proxy_pass http://$control_center_upstream; proxy_set_header Host $host; }
location /docker          { proxy_pass http://$control_center_upstream; proxy_set_header Host $host; }
location /gateway-traffic { proxy_pass http://$control_center_upstream; proxy_set_header Host $host; }
location /gpu             { proxy_pass http://$control_center_upstream; proxy_set_header Host $host; }
location /health           { proxy_pass http://$control_center_upstream; proxy_set_header Host $host; }

location /image-freshness { proxy_pass http://$control_center_upstream; proxy_set_header Host $host; }
location /integrity       { proxy_pass http://$control_center_upstream; proxy_set_header Host $host; }
location /knowledge-base  { proxy_pass http://$control_center_upstream; proxy_set_header Host $host; }
location /known-issues    { proxy_pass http://$control_center_upstream; proxy_set_header Host $host; }
location /license         { proxy_pass http://$control_center_upstream; proxy_set_header Host $host; }
location /llms            { proxy_pass http://$control_center_upstream; proxy_set_header Host $host; }
location /orgs            { proxy_pass http://$control_center_upstream; proxy_set_header Host $host; }
location /platform        { proxy_pass http://$control_center_upstream; proxy_set_header Host $host; }
location /reference       { proxy_pass http://$control_center_upstream; proxy_set_header Host $host; }
location /report          { proxy_pass http://$control_center_upstream; proxy_set_header Host $host; }
location /services        { proxy_pass http://$control_center_upstream; proxy_set_header Host $host; }
# PR-C (Control Center Sessions Integration): routes_sessions_proxy.py.
# No collision with a frontend SPA route -- 'sessions' has no deep-link
# path of its own in AdminApp.tsx (reached purely via in-app nav state,
# same as 'audit-logs'/'security-overview'), so a plain prefix match is
# safe, same reasoning as /tes, /model-registry, etc. below.
location /sessions        { proxy_pass http://$control_center_upstream; proxy_set_header Host $host; }
location /storage         { proxy_pass http://$control_center_upstream; proxy_set_header Host $host; }
location /summary         { proxy_pass http://$control_center_upstream; proxy_set_header Host $host; }
location /usage           { proxy_pass http://$control_center_upstream; proxy_set_header Host $host; }

# PR E (Admin Console Production Hardening): PR A1-A4's own proxy
# routers (routes_tes_proxy.py, routes_model_registry_proxy.py,
# routes_workflow_bundles_proxy.py, routes_rag_proxy.py) were merged
# without a matching entry here -- this file's own module comment above
# ("a future PR adding a new top-level route needs a matching entry
# here, or it's unreachable through this nginx") predicted exactly this
# gap. None of the four are client-side SPA routes (ToolExecutionPage/
# AIModelsPage/WorkflowsPage/RAGPage never call window.history.pushState
# -- confirmed by reading AdminApp.tsx directly, unlike /organizations
# or /billing above), so a plain prefix match is safe, no regex/scoping
# needed. Without this, every fetch from those four pages fell through
# to `location /`'s SPA fallback and got index.html back instead of
# JSON -- confirmed as the actual, currently-shipping production
# behavior, not a hypothetical.
location /tes              { proxy_pass http://$control_center_upstream; proxy_set_header Host $host; }
location /model-registry   { proxy_pass http://$control_center_upstream; proxy_set_header Host $host; }
location /workflow-bundles { proxy_pass http://$control_center_upstream; proxy_set_header Host $host; }
location /rag              { proxy_pass http://$control_center_upstream; proxy_set_header Host $host; }

# /organizations is BOTH a backend API prefix (routes_role_proxy.py:
# /organizations/{id}/roles, /organizations/{id}/permissions) AND
# AdminApp's own client-side route root (/organizations,
# /organizations/{id} -- see window.location.pathname matches in
# frontend/cc-ui/src/apps/AdminApp.tsx). A plain `location
# /organizations` prefix match would swallow the frontend's own bare/
# {id} page-refresh routes and send them to FastAPI, which has no route
# matching those shapes (its real routes always have a third segment) --
# a 404 where a SPA refresh must get index.html instead. Scoped to the
# two real backend shapes only; everything else under /organizations/*
# falls through to `location /`'s try_files -> index.html.
location ~ ^/organizations/[^/]+/(roles|permissions)$ {
    proxy_pass http://$control_center_upstream;
    proxy_set_header Host $host;
}

# Same collision class as /organizations above: AdminApp's own client
# route root is /billing, /billing/{id} (the org being viewed), while
# every real backend billing route is /billing/organizations/{id}/...
# (routes_billing_proxy.py) -- the shapes never overlap, so a scoped
# prefix (not a regex) is enough, but it must stay scoped to
# "/billing/organizations/" specifically -- a broad `/billing` prefix
# would swallow the frontend's own bare /billing/{id} pages exactly like
# the unscoped /organizations case would have.
location ^~ /billing/organizations/ {
    proxy_pass http://$control_center_upstream;
    proxy_set_header Host $host;
}
