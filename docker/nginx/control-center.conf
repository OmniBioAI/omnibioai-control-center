# PR14.7B: host-based domain split for control-center's two frontend
# bundles (Admin Console dual build, see docs/admin-console-build.md).
# Both server blocks listen on the same port and are dispatched purely
# by the incoming Host header -- nginx picks the literal server_name
# match over the `default_server` catch-all regardless of block order.
# Domain is a serving/UX split only, never an authorization boundary --
# both bundles hit the same backend, gated by the same IAM checks
# (require_permission/require_admin in control_center/main.py), entirely
# unaffected by which of these two blocks served the request.

server {
    listen 5174 default_server;
    server_name control.omnibioai.org;

    root /usr/share/nginx/html/control;
    index index.html;

    # SPA fallback: any path that isn't a real built asset (JS/CSS/etc.)
    # resolves to index.html so client-side routing survives a refresh.
    # ControlApp itself has no deep-linkable routes today (ops pages
    # only), but this stays domain-symmetric with the admin block below.
    location / {
        try_files $uri $uri/ /index.html;
    }

    include /etc/nginx/api-proxy.conf;
}

server {
    listen 5174;
    server_name admin.omnibioai.org;

    root /usr/share/nginx/html/admin;
    index index.html;

    # Same SPA fallback as above -- this is what makes AdminApp's
    # hand-rolled pushState routes (/organizations, /users, /iam, ...)
    # survive a hard refresh instead of 404ing against nginx directly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    include /etc/nginx/api-proxy.conf;
}
