# PR14.7B: host-based domain split for control-center's two frontend
# bundles (Admin Console dual build, see docs/admin-console-build.md).
# Both server blocks listen on the same port and are dispatched purely
# by the incoming Host header -- nginx picks the literal server_name
# match over the `default_server` catch-all regardless of block order.
# Domain is a serving/UX split only, never an authorization boundary --
# both bundles hit the same backend, gated by the same IAM checks
# (require_permission/require_admin in control_center/main.py), entirely
# unaffected by which of these two blocks served the request.

# Admin Console login fix: 127.0.0.11 is Docker's embedded DNS server,
# reachable from every container on a user-defined bridge network (same
# address used for this exact purpose in the other nginx config,
# omnibioai-studio/docker/nginx-router.conf, for billing-service).
# `valid=10s` caps how long a resolved IP is trusted before the next
# request re-resolves it -- short enough that a control-center container
# recreate is picked up almost immediately, long enough to not add a DNS
# round trip to every request. Declared once per server block (not
# globally in nginx.conf) since `resolver` is only valid in http/server/
# location context, and api-proxy.conf's locations are `include`d
# directly into these server blocks.
# Public showcase hardening: per-visitor rate limit for the anonymous
# control.omnibioai.org site only (admin.omnibioai.org is unaffected).
# Traffic arrives through the Cloudflare tunnel, so $remote_addr is the
# tunnel for every visitor; key on Cloudflare's CF-Connecting-IP instead,
# falling back to the socket address for direct (non-Cloudflare) requests.
# 10 requests/s sustained with a burst of 40 covers a full page load
# (bundle + ~10 parallel API calls) and the 15-30 s polling, while capping
# scrapers. The backend additionally caches anonymous responses
# (core/public_cache.py), so allowed requests stay cheap.
map $http_cf_connecting_ip $public_client_key {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $public_client_key zone=public_site:10m rate=10r/s;

server {
    listen 5174 default_server;
    server_name control.omnibioai.org;
    resolver 127.0.0.11 valid=10s;
    set $control_center_upstream control-center:7070;

    limit_req zone=public_site burst=40 nodelay;
    limit_req_status 429;

    root /usr/share/nginx/html/control;
    index index.html;

    # SPA fallback: any path that isn't a real built asset (JS/CSS/etc.)
    # resolves to index.html so client-side routing survives a refresh.
    # ControlApp itself has no deep-linkable routes today (ops pages
    # only), but this stays domain-symmetric with the admin block below.
    location / {
        try_files $uri $uri/ /index.html;
    }

    include /etc/nginx/api-proxy.conf;
}

server {
    listen 5174;
    server_name admin.omnibioai.org;
    resolver 127.0.0.11 valid=10s;
    set $control_center_upstream control-center:7070;

    root /usr/share/nginx/html/admin;
    index index.html;

    # Same SPA fallback as above -- this is what makes AdminApp's
    # hand-rolled pushState routes (/organizations, /users, /iam, ...)
    # survive a hard refresh instead of 404ing against nginx directly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    include /etc/nginx/api-proxy.conf;
}
