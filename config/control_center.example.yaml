services:
  mysql:
    type: mysql
    host: mysql
    port: 3306

  redis:
    type: redis
    host: redis
    port: 6379

  toolserver:
    type: http
    url: http://toolserver:9090/health
    timeout_s: 2

  tes:
    type: http
    url: http://tes:8081/health
    timeout_s: 2

  omnibioai:
    type: http
    url: http://omnibioai:8000/
    timeout_s: 2

  lims-x:
    type: http
    url: http://lims-x:7000/
    timeout_s: 2

system:
  storage_targets:
    - name: Root filesystem
      role: root
      host_path: /
      expected_filesystem_uuid: REPLACE_WITH_ROOT_FILESYSTEM_UUID
    - name: Backup
      role: backup
      host_path: /mnt/omnibioai-backup20tb
      expected_filesystem_uuid: REPLACE_WITH_SDD1_FILESYSTEM_UUID
    - name: Archive
      role: archive
      host_path: /mnt/omnibioai-archive22tb
      expected_filesystem_uuid: REPLACE_WITH_SDA1_FILESYSTEM_UUID
    - name: Primary
      role: primary
      host_path: /mnt/wdpro26tb
      expected_filesystem_uuid: REPLACE_WHEN_REPLACED
      state: being_replaced
      mount: false
  disk_checks:
    - path: /workspace/out
      warn_pct_free_below: 15
    - path: /workspace/tmpdata
      warn_pct_free_below: 10
    - path: /workspace/local_registry
      warn_pct_free_below: 10
  integrity_checks:
    - name: data
      path: /workspace/data
    - name: work
      path: /workspace/work
