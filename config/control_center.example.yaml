services:
  mysql:
    type: mysql
    host: mysql
    port: 3306

  redis:
    type: redis
    host: redis
    port: 6379

  toolserver:
    type: http
    url: http://toolserver:9090/health
    timeout_s: 2

  tes:
    type: http
    url: http://tes:8081/health
    timeout_s: 2

  omnibioai:
    type: http
    url: http://omnibioai:8000/
    timeout_s: 2

  lims-x:
    type: http
    url: http://lims-x:7000/
    timeout_s: 2

system:
  # Replace each all-zero UUID with `findmnt -n -o UUID <host_path>` on the host.
  storage_targets:
    - name: Root filesystem
      role: root
      host_path: /
      expected_filesystem_uuid: 00000000-0000-0000-0000-000000000000
    - name: Backup
      role: backup
      host_path: /mnt/omnibioai-backup20tb
      expected_filesystem_uuid: 00000000-0000-0000-0000-000000000000
    - name: Archive
      role: archive
      host_path: /mnt/omnibioai-archive22tb
      expected_filesystem_uuid: 00000000-0000-0000-0000-000000000000
    - name: OmniBioAI data 2 TB
      role: data2tb
      host_path: /media/manish/omnibioai-data
      expected_filesystem_uuid: 00000000-0000-0000-0000-000000000000
      read_only: true
    - name: Archive 2 TB B
      role: archive2tb-b
      host_path: /mnt/omnibioai-archive2tb-b
      expected_filesystem_uuid: 0000-0000
      read_only: true
    - name: Archive pool
      role: archive-pool
      kind: mergerfs
      host_path: /mnt/omnibioai-archive
      branches:
        - /mnt/omnibioai-archive22tb
        - /media/manish/omnibioai-data
        - /mnt/omnibioai-archive2tb-b
    - name: Primary
      role: primary
      host_path: /mnt/wdpro26tb
      expected_filesystem_uuid: 00000000-0000-0000-0000-000000000000
      state: being_replaced
      mount: false
  disk_checks:
    - path: /workspace/out
      warn_pct_free_below: 15
    - path: /workspace/tmpdata
      warn_pct_free_below: 10
    - path: /workspace/local_registry
      warn_pct_free_below: 10
  integrity_checks:
    - name: data
      path: /workspace/data
    - name: work
      path: /workspace/work
